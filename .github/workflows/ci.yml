name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      # `build` compiles `src/` and `cli/`. This adds the third project,
      # `tsconfig.templates.json`, which type-checks the starter app `waniwani
      # init` copies out against the `dist/` the step above just produced. It is
      # the check the starter had none of while it lived in template literals:
      # change `defineTool` or `useWidget` and this is what goes red.
      - run: bun run typecheck

      # The type-checker reads the starter as TypeScript. This reads it as an
      # app, which is the half that catches a file renamed out from under the
      # `TOOL` and `WIDGET` names in `cli/init.ts`.
      - run: node packages/kit/dist/cli/index.js check packages/kit/templates/starter

      - run: bun run lint

  # `build` above is `tsc`, which type-checks this package and nothing else. It
  # cannot notice that the pinned template's layout moved, that the framework
  # changed under the version bumped in packages/kit/package.json, or that the
  # generator stopped emitting something the template reads: every one of those
  # only shows up once the generator has run and the result has been built and
  # served. That is this job, and it is what makes a dependency bump reviewable
  # instead of hopeful.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The framework imports `globSync` from `node:fs` and the generated
      # project declares a Node floor of its own; the script says so if this
      # drops below it.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # No `--template`, so this runs against the commit
      # packages/kit/cli/template-pin.ts holds. A bump to that record is
      # therefore a PR that has to go green with the new template before it can
      # land.
      #
      # The last step is the one that catches the most, because ejecting hands
      # someone an ordinary npm project: it installs with plain `npm install`,
      # no `--legacy-peer-deps`, so a peer conflict between the SDK and the
      # framework fails here rather than in a customer's terminal.
      - run: bun scripts/template-contract.ts
